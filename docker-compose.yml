version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smart_cafe_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartcafe
      POSTGRES_PASSWORD: smartcafe_dev_pass
      POSTGRES_DB: smart_cafe_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: smart_cafe_redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data

  adminer:
    image: adminer:latest
    container_name: smart_cafe_adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data: